name: Publish site

# Runs on every push, every six hours, and on demand. The scheduled run is what
# makes a new Substack essay appear on adityadave.in without anyone touching
# anything.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the safety rails (publishes even if the feed is empty)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site from Substack feed
        env:
          FORCE_BUILD: ${{ inputs.force && '1' || '0' }}
        run: python3 build/build.py

      - name: Commit any changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site build/cache/essays.json

          if ! git diff --staged --quiet; then
            git commit -m "Rebuild site from Substack feed"
            git push
            echo "Published. Cloudflare Pages will deploy this commit."
            exit 0
          fi

          # Nothing changed. GitHub switches off scheduled workflows after 60
          # days of repository inactivity, which would silently kill the mirror
          # during any long gap between essays. A monthly heartbeat commit keeps
          # the schedule alive without touching the site itself.
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))

          if [ "$days" -ge 30 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > build/cache/last-run
            git add build/cache/last-run
            git commit -m "Heartbeat: keep the scheduled rebuild alive"
            git push
            echo "No content changes; pushed a heartbeat (${days} days idle)."
          else
            echo "No changes - nothing to publish (${days} days since last commit)."
          fi
