name: Publish site

# Runs on every push, every six hours, and on demand. The scheduled run is what
# makes a new Substack essay appear on adityadave.in without anyone touching
# anything.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the safety rails (publishes even if the feed is empty)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site from Substack feed
        env:
          FORCE_BUILD: ${{ inputs.force && '1' || '0' }}
        run: python3 build/build.py

      - name: Commit any changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site build/cache/essays.json
          if git diff --staged --quiet; then
            echo "No changes - nothing to publish."
          else
            git commit -m "Rebuild site from Substack feed"
            git push
            echo "Published. Cloudflare Pages will deploy this commit."
          fi
