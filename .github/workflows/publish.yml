name: Publish site

# Runs on every push, every six hours, and on demand.
#
# Two outputs:
#   main    - source plus the generated site/, for history and review
#   deploy  - the finished site at the branch root, which is what Hostinger
#             pulls. Hostinger deploys a whole branch, not a subfolder, so the
#             site cannot simply live in site/ on main.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the safety rails (publishes even if the feed is empty)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site from Substack feed
        env:
          FORCE_BUILD: ${{ inputs.force && '1' || '0' }}
        run: python3 build/build.py

      - name: Commit any changes to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site build/cache/essays.json

          if ! git diff --staged --quiet; then
            git commit -m "Rebuild site from Substack feed"
            git push
            echo "changed=yes" >> "$GITHUB_ENV"
            exit 0
          fi

          # GitHub switches off scheduled workflows after 60 days of repository
          # inactivity, which would silently kill the mirror during any long gap
          # between essays. A monthly heartbeat keeps the schedule alive.
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))

          if [ "$days" -ge 30 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > build/cache/last-run
            git add build/cache/last-run
            git commit -m "Heartbeat: keep the scheduled rebuild alive"
            git push
            echo "No content changes; pushed a heartbeat (${days} days idle)."
          else
            echo "No content changes (${days} days since last commit)."
          fi

      - name: Package for Hostinger
        run: |
          python3 build/package-hostinger.py
          # The visible .htaccess twin exists only to survive manual
          # drag-and-drop uploads. Publishing it would expose the server
          # config at a readable URL.
          rm -f _upload-to-public_html/htaccess-RENAME-ME.txt

      - name: Publish the deploy branch
        run: |
          # Rebuild the deploy branch from scratch each time. Its history is
          # disposable - main holds the real history - and a fresh tree
          # guarantees deleted files actually disappear from the server.
          work=$(mktemp -d)
          cp -a _upload-to-public_html/. "$work"/

          cd "$work"
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -qb deploy
          git add -A
          git commit -q -m "Deploy $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            deploy

          echo "Pushed $(find . -type f -not -path './.git/*' | wc -l | tr -d ' ') files to the deploy branch."
