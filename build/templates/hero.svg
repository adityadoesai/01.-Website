<svg class="hero-art" viewBox="0 0 1200 470" role="img"
     aria-label="A cartoon Aditya at a cluttered desk, mid-multitask: one hand typing, the other raising a coffee mug, with a stethoscope, a stack of books, a buzzing phone, sticky notes and a rising chart around him.">

  <!-- palette, kept literal because this is an illustration rather than UI chrome:
       ink #1A1815 . paper #FBF9F5 . rust #9A3B24 . sage #77896B
       skin #D2996B . skin dark #B27B4F . hair #241C16 . shirt #2C2724
       wood #DCC9A4 . wood dark #C3AC82 . screen #33403F -->

  <rect x="6" y="6" width="1188" height="458" rx="18" fill="#F6F1E7"/>

  <!-- ============ BACK WALL ============ -->

  <!-- corkboard -->
  <g>
    <rect x="62" y="42" width="300" height="206" rx="8" fill="#E4C79A" stroke="#1A1815" stroke-width="3"/>
    <rect x="76" y="56" width="272" height="178" rx="4" fill="#EBD4AE"/>

    <rect x="96" y="76" width="70" height="64" fill="#F2E3A8" stroke="#1A1815" stroke-width="2.5"/>
    <line x1="108" y1="98" x2="154" y2="98" stroke="#1A1815" stroke-width="2.5" opacity=".5"/>
    <line x1="108" y1="112" x2="146" y2="112" stroke="#1A1815" stroke-width="2.5" opacity=".5"/>

    <rect x="182" y="68" width="70" height="64" fill="#EFC9B4" stroke="#1A1815" stroke-width="2.5"/>
    <line x1="194" y1="90" x2="240" y2="90" stroke="#1A1815" stroke-width="2.5" opacity=".5"/>
    <line x1="194" y1="104" x2="228" y2="104" stroke="#1A1815" stroke-width="2.5" opacity=".5"/>

    <rect x="268" y="80" width="70" height="64" fill="#CFDCC4" stroke="#1A1815" stroke-width="2.5"/>
    <line x1="280" y1="102" x2="326" y2="102" stroke="#1A1815" stroke-width="2.5" opacity=".5"/>
    <line x1="280" y1="116" x2="314" y2="116" stroke="#1A1815" stroke-width="2.5" opacity=".5"/>

    <rect x="126" y="152" width="176" height="62" fill="#FBF9F5" stroke="#1A1815" stroke-width="2.5"/>
    <polyline points="140,202 174,184 206,192 238,164 272,170 290,146"
              fill="none" stroke="#9A3B24" stroke-width="3.5"
              stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="290" cy="146" r="4.5" fill="#9A3B24"/>
  </g>

  <!-- monitor -->
  <g>
    <rect x="846" y="46" width="292" height="188" rx="8" fill="#33403F" stroke="#1A1815" stroke-width="3"/>
    <rect x="862" y="62" width="260" height="142" rx="3" fill="#EAF0EC"/>
    <line x1="878" y1="184" x2="1104" y2="184" stroke="#1A1815" stroke-width="2.5" opacity=".4"/>
    <line x1="878" y1="184" x2="878" y2="80" stroke="#1A1815" stroke-width="2.5" opacity=".4"/>
    <rect x="894" y="150" width="26" height="34" fill="#CFDCC4" stroke="#1A1815" stroke-width="2"/>
    <rect x="932" y="130" width="26" height="54" fill="#CFDCC4" stroke="#1A1815" stroke-width="2"/>
    <rect x="970" y="140" width="26" height="44" fill="#CFDCC4" stroke="#1A1815" stroke-width="2"/>
    <rect x="1008" y="110" width="26" height="74" fill="#EFC9B4" stroke="#1A1815" stroke-width="2"/>
    <rect x="1046" y="90" width="26" height="94" fill="#9A3B24" stroke="#1A1815" stroke-width="2"/>
    <polyline points="907,142 945,122 983,132 1021,100 1059,82"
              fill="none" stroke="#1A1815" stroke-width="3"
              stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="974" y="234" width="36" height="30" fill="#33403F" stroke="#1A1815" stroke-width="3"/>
    <rect x="928" y="260" width="128" height="14" rx="7" fill="#33403F" stroke="#1A1815" stroke-width="3"/>
  </g>

  <!-- ============ FIGURE ============ -->
  <g>
    <!-- raised arm: shoulder to mug -->
    <path d="M520 322 C 456 314, 424 268, 434 224"
          fill="none" stroke="#2C2724" stroke-width="38" stroke-linecap="round"/>
    <path d="M520 322 C 456 314, 424 268, 434 224"
          fill="none" stroke="#1A1815" stroke-width="3" stroke-linecap="round" opacity=".0"/>

    <!-- typing arm: shoulder out to the keyboard -->
    <path d="M684 320 C 722 326, 740 350, 712 372"
          fill="none" stroke="#2C2724" stroke-width="38" stroke-linecap="round"/>

    <!-- torso -->
    <path d="M600 276
             C 540 276, 500 312, 496 382
             L 704 382
             C 700 312, 660 276, 600 276 Z"
          fill="#2C2724" stroke="#1A1815" stroke-width="3"/>
    <path d="M566 284 L600 320 L634 284" fill="none" stroke="#F6F1E7" stroke-width="4" stroke-linejoin="round"/>
    <line x1="600" y1="320" x2="600" y2="382" stroke="#F6F1E7" stroke-width="2.5" opacity=".45"/>

    <!-- neck -->
    <rect x="574" y="228" width="52" height="60" rx="18" fill="#B27B4F" stroke="#1A1815" stroke-width="3"/>

    <!-- ears -->
    <circle cx="516" cy="176" r="15" fill="#D2996B" stroke="#1A1815" stroke-width="3"/>
    <circle cx="684" cy="176" r="15" fill="#D2996B" stroke="#1A1815" stroke-width="3"/>

    <!-- head -->
    <ellipse cx="600" cy="164" rx="84" ry="90" fill="#D2996B" stroke="#1A1815" stroke-width="3"/>

    <!-- hair: a full cap sitting on the head, heavier on one side -->
    <path d="M517 168
             C 508 92, 548 48, 604 48
             C 662 48, 700 92, 683 172
             C 676 138, 660 116, 634 108
             C 606 98, 566 112, 542 138
             C 530 148, 522 156, 517 168 Z"
          fill="#241C16" stroke="#1A1815" stroke-width="3" stroke-linejoin="round"/>
    <!-- a couple of strands for texture -->
    <path d="M556 96 C 578 78, 610 72, 636 82" fill="none" stroke="#3A2E24" stroke-width="4" stroke-linecap="round"/>
    <path d="M596 68 C 622 64, 648 74, 662 94" fill="none" stroke="#3A2E24" stroke-width="4" stroke-linecap="round"/>

    <!-- eyebrows -->
    <path d="M552 146 C 566 136, 586 136, 596 143" fill="none" stroke="#241C16" stroke-width="5" stroke-linecap="round"/>
    <path d="M604 143 C 616 136, 636 136, 650 146" fill="none" stroke="#241C16" stroke-width="5" stroke-linecap="round"/>

    <!-- eyes: creased, because he is grinning -->
    <path d="M562 176 C 570 166, 584 166, 592 176" fill="none" stroke="#1A1815" stroke-width="5" stroke-linecap="round"/>
    <path d="M610 176 C 618 166, 632 166, 640 176" fill="none" stroke="#1A1815" stroke-width="5" stroke-linecap="round"/>

    <!-- wire glasses -->
    <g fill="none" stroke="#1A1815" stroke-width="3">
      <circle cx="576" cy="174" r="27"/>
      <circle cx="626" cy="174" r="27"/>
      <path d="M603 170 C 601 166, 601 166, 599 170"/>
      <path d="M549 168 L 522 172"/>
      <path d="M653 168 L 680 172"/>
    </g>

    <!-- nose -->
    <path d="M600 184 C 592 200, 592 208, 604 210" fill="none" stroke="#A96F44" stroke-width="4" stroke-linecap="round"/>

    <!-- wide open grin -->
    <path d="M562 222 C 578 254, 622 254, 638 222 Z"
          fill="#FBF9F5" stroke="#1A1815" stroke-width="3" stroke-linejoin="round"/>
    <path d="M566 224 L 634 224" stroke="#1A1815" stroke-width="2.5"/>
  </g>

  <!-- ============ DESK ============ -->
  <path d="M40 382 L1160 382 L1188 424 L12 424 Z"
        fill="#DCC9A4" stroke="#1A1815" stroke-width="3" stroke-linejoin="round"/>
  <rect x="12" y="422" width="1176" height="16" fill="#C3AC82" stroke="#1A1815" stroke-width="3"/>

  <!-- ============ THINGS ON AND ABOVE THE DESK ============ -->

  <!-- mug, held aloft -->
  <g>
    <path d="M396 200 C 400 188, 392 182, 396 170" fill="none" stroke="#1A1815" stroke-width="2.5" stroke-linecap="round" opacity=".45"/>
    <path d="M420 200 C 424 188, 416 182, 420 170" fill="none" stroke="#1A1815" stroke-width="2.5" stroke-linecap="round" opacity=".45"/>
    <ellipse cx="404" cy="256" rx="27" ry="21" fill="#D2996B" stroke="#1A1815" stroke-width="3"/>
    <rect x="380" y="206" width="62" height="54" rx="7" fill="#9A3B24" stroke="#1A1815" stroke-width="3"/>
    <path d="M442 220 C 464 220, 464 248, 442 248" fill="none" stroke="#1A1815" stroke-width="3"/>
    <path d="M386 254 C 396 246, 412 246, 422 254" fill="none" stroke="#1A1815" stroke-width="3" stroke-linecap="round"/>
    <path d="M394 262 L394 270" stroke="#B27B4F" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M406 264 L406 272" stroke="#B27B4F" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M418 262 L418 270" stroke="#B27B4F" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- laptop -->
  <g>
    <path d="M524 302 L676 302 L676 374 L524 374 Z" fill="#33403F" stroke="#1A1815" stroke-width="3"/>
    <rect x="536" y="314" width="128" height="48" rx="2" fill="#EAF0EC"/>
    <line x1="548" y1="330" x2="622" y2="330" stroke="#1A1815" stroke-width="2.5" opacity=".35"/>
    <line x1="548" y1="344" x2="602" y2="344" stroke="#1A1815" stroke-width="2.5" opacity=".35"/>
    <path d="M500 374 L700 374 L716 392 L484 392 Z"
          fill="#E4E0D6" stroke="#1A1815" stroke-width="3" stroke-linejoin="round"/>
    <line x1="516" y1="383" x2="684" y2="383" stroke="#1A1815" stroke-width="2" opacity=".25"/>
  </g>

  <!-- typing hand resting on the keyboard -->
  <g>
    <ellipse cx="700" cy="379" rx="25" ry="16" fill="#D2996B" stroke="#1A1815" stroke-width="3"/>
    <path d="M688 383 L688 391" stroke="#B27B4F" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M700 385 L700 393" stroke="#B27B4F" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M712 383 L712 391" stroke="#B27B4F" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- books -->
  <g>
    <rect x="74" y="352" width="132" height="24" rx="3" fill="#9A3B24" stroke="#1A1815" stroke-width="3"/>
    <rect x="64" y="328" width="132" height="24" rx="3" fill="#77896B" stroke="#1A1815" stroke-width="3"/>
    <rect x="82" y="304" width="132" height="24" rx="3" fill="#E4C79A" stroke="#1A1815" stroke-width="3"/>
    <line x1="90" y1="316" x2="116" y2="316" stroke="#1A1815" stroke-width="2.5" opacity=".45"/>
    <line x1="72" y1="340" x2="98" y2="340" stroke="#1A1815" stroke-width="2.5" opacity=".45"/>
    <line x1="82" y1="364" x2="108" y2="364" stroke="#1A1815" stroke-width="2.5" opacity=".45"/>
  </g>

  <!-- stethoscope, lying on the desk -->
  <g fill="none" stroke="#1A1815" stroke-width="3.5" stroke-linecap="round">
    <ellipse cx="288" cy="398" rx="56" ry="17"/>
    <path d="M342 402 C 356 410, 364 414, 372 416"/>
  </g>
  <circle cx="384" cy="416" r="13" fill="#C3C7CC" stroke="#1A1815" stroke-width="3"/>
  <circle cx="236" cy="392" r="6" fill="#1A1815"/>
  <circle cx="238" cy="406" r="6" fill="#1A1815"/>

  <!-- loose papers -->
  <g>
    <path d="M772 392 L878 376 L888 406 L782 422 Z"
          fill="#FBF9F5" stroke="#1A1815" stroke-width="3" stroke-linejoin="round"/>
    <line x1="790" y1="394" x2="864" y2="382" stroke="#1A1815" stroke-width="2.5" opacity=".35"/>
    <line x1="794" y1="407" x2="856" y2="396" stroke="#1A1815" stroke-width="2.5" opacity=".35"/>
  </g>

  <!-- buzzing phone -->
  <g>
    <rect x="924" y="336" width="50" height="84" rx="9" fill="#2C2724" stroke="#1A1815" stroke-width="3"/>
    <rect x="934" y="348" width="30" height="56" rx="2" fill="#EAF0EC"/>
    <circle cx="972" cy="338" r="11" fill="#9A3B24" stroke="#1A1815" stroke-width="2.5"/>
    <g stroke="#9A3B24" stroke-width="3" stroke-linecap="round">
      <path d="M990 320 C 1002 312, 1012 312, 1022 318"/>
      <path d="M994 302 C 1010 290, 1026 290, 1040 300"/>
    </g>
  </g>

  <!-- plant -->
  <g>
    <path d="M1072 372 L1128 372 L1120 424 L1080 424 Z"
          fill="#C86F4A" stroke="#1A1815" stroke-width="3" stroke-linejoin="round"/>
    <path d="M1100 372 C 1088 346, 1064 342, 1056 320 C 1082 320, 1098 338, 1100 362"
          fill="#77896B" stroke="#1A1815" stroke-width="3" stroke-linejoin="round"/>
    <path d="M1100 372 C 1112 350, 1136 346, 1142 326 C 1118 324, 1102 342, 1100 364"
          fill="#8C9E7E" stroke="#1A1815" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- pen -->
  <g>
    <path d="M716 410 L772 400 L774 410 L718 420 Z"
          fill="#77896B" stroke="#1A1815" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M716 410 L704 414 L718 420 Z" fill="#1A1815"/>
  </g>
</svg>
